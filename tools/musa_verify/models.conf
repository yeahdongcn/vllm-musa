# vllm-musa verify matrix — one functional server smoke per line, each pinned to its own MUSA device.
# Columns: family | model_path | device | port | tp | expect
#   family     : short name used in the PASS/FAIL line and log filenames
#   model_path : absolute path inside the container (see curated/musa-remote-config.md, <llm-root>=/home/dist)
#   device     : MUSA_VISIBLE_DEVICES value (physical device id); smokes on distinct devices run in parallel
#   port       : OpenAI server port (must be unique per concurrent smoke)
#   tp         : tensor-parallel size (use 1 to keep one model on one device)
#   expect     : case-insensitive substring required in the chat response (semantic pass check)
#
# Add rows to widen coverage (the runners iterate this file). Keep one device per row for
# clean parallelism; the smoke SKIPs (does not steal) any device that is already busy.
